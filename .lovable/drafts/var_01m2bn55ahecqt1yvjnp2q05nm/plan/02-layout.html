<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { fill: var(--fg-primary); font-size: 12px; }
    .note { fill: var(--fg-secondary); font-size: 12px; }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .greek { fill: var(--border-translucent); }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>

  <!-- phone frame: before -->
  <rect x="24" y="16" width="180" height="360" rx="8" class="box"/>
  <text x="114" y="8" class="note" text-anchor="middle">now</text>
  <rect x="36" y="30" width="156" height="46" rx="8" fill="var(--bg-muted)"/>
  <text x="44" y="58" class="lbl">checklist card</text>
  <rect x="36" y="88" width="120" height="8" rx="4" class="greek"/>
  <rect x="36" y="104" width="156" height="54" rx="8" class="box"/>
  <rect x="48" y="122" width="90" height="8" rx="4" class="greek"/>
  <rect x="48" y="138" width="60" height="8" rx="4" class="greek"/>
  <rect x="36" y="172" width="120" height="8" rx="4" class="greek"/>
  <rect x="36" y="192" width="156" height="130" rx="8" class="zone"/>
  <text x="114" y="262" class="note" text-anchor="middle">unused space</text>
  <rect x="36" y="334" width="156" height="30" rx="8" fill="var(--bg-muted)"/>

  <!-- arrow -->
  <line x1="226" y1="196" x2="286" y2="196" stroke="var(--fg-secondary)" stroke-width="1" marker-end="url(#chev)"/>
  <defs>
    <marker id="chev" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7" fill="none" stroke="var(--fg-secondary)" stroke-width="1"/>
    </marker>
  </defs>

  <!-- phone frame: after -->
  <rect x="306" y="16" width="180" height="360" rx="8" class="box"/>
  <text x="396" y="8" class="note" text-anchor="middle">after</text>
  <rect x="318" y="30" width="120" height="8" rx="4" class="greek"/>
  <rect x="318" y="46" width="156" height="54" rx="8" class="box"/>
  <rect x="330" y="64" width="90" height="8" rx="4" class="greek"/>
  <rect x="330" y="80" width="60" height="8" rx="4" class="greek"/>
  <rect x="318" y="114" width="120" height="8" rx="4" class="greek"/>

  <!-- bubble in the empty space -->
  <rect x="318" y="150" width="156" height="132" rx="8" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)" stroke-width="1"/>
  <rect x="326" y="158" width="14" height="14" rx="4" fill="var(--bg-primary)"/>
  <text x="346" y="169" class="lbl" style="fill: var(--fg-accent)">Get set up</text>
  <text x="452" y="169" class="note" style="fill: var(--fg-accent)">1/3</text>
  <text x="464" y="169" class="note" style="fill: var(--fg-accent)">x</text>
  <rect x="318" y="180" width="156" height="102" fill="var(--bg-secondary)"/>
  <rect x="328" y="192" width="100" height="8" rx="4" class="greek"/>
  <rect x="328" y="208" width="130" height="8" rx="4" class="greek"/>
  <rect x="328" y="228" width="62" height="18" rx="9" fill="var(--bg-accent)"/>
  <rect x="328" y="258" width="90" height="8" rx="4" class="greek"/>
  <path d="M446,282 L460,282 L446,296 Z" fill="var(--fg-accent)"/>

  <!-- button -->
  <rect x="440" y="300" width="30" height="30" rx="9" fill="var(--bg-accent)"/>
  <circle cx="470" cy="300" r="7" fill="var(--bg-secondary)" stroke="var(--fg-secondary)" stroke-width="1"/>
  <text x="470" y="304" class="note" text-anchor="middle">3</text>
  <rect x="318" y="334" width="156" height="30" rx="8" fill="var(--bg-muted)"/>

  <!-- ledger -->
  <circle cx="512" cy="164" r="9" fill="var(--bg-accent)"/>
  <text x="512" y="168" text-anchor="middle" style="font-size:11px; fill: var(--fg-emphasis); font-family: var(--font-sans)">1</text>
  <text x="528" y="168" class="note">bubble floats over the free space</text>
  <circle cx="512" cy="310" r="9" fill="var(--bg-accent)"/>
  <text x="512" y="314" text-anchor="middle" style="font-size:11px; fill: var(--fg-emphasis); font-family: var(--font-sans)">2</text>
  <text x="528" y="314" class="note">tail points back at the button</text>
</svg>
