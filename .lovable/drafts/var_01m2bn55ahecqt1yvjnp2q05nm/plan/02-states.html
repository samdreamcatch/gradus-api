<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: var(--fg-secondary); }
    .tag { font-size: 12px; fill: var(--fg-secondary); }
    .done { fill: var(--fg-secondary); font-size: 14px; }
  </style>

  <rect x="20" y="20" width="330" height="290" rx="8" fill="none" stroke="var(--fg-secondary)"/>

  <text class="lbl" x="44" y="52">Get set up</text>
  <text class="tag" x="150" y="52">1 / 3 steps</text>
  <circle cx="32" cy="47" r="7" fill="none" stroke="var(--fg-secondary)"/>
  <text class="sm" x="322" y="52" text-anchor="end">×</text>
  <line x1="20" y1="70" x2="350" y2="70" stroke="var(--border-translucent)"/>

  <circle cx="44" cy="98" r="8" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)"/>
  <text class="done" x="64" y="103">Upload or input your schedule</text>
  <line x1="64" y1="99" x2="262" y2="99" stroke="var(--fg-secondary)"/>
  <line x1="20" y1="122" x2="350" y2="122" stroke="var(--border-translucent)"/>

  <circle cx="44" cy="150" r="8" fill="none" stroke="var(--fg-secondary)"/>
  <text class="lbl" x="64" y="155">Invite parents or adult athletes</text>
  <text class="sm" x="64" y="176">They see plans, schedules, and progress.</text>
  <rect x="64" y="188" width="104" height="30" rx="15" fill="var(--bg-accent)"/>
  <text x="116" y="207" text-anchor="middle" style="font-size:13px; fill: var(--fg-emphasis)">Invite</text>
  <line x1="20" y1="238" x2="350" y2="238" stroke="var(--border-translucent)"/>

  <circle cx="44" cy="266" r="8" fill="none" stroke="var(--fg-secondary)"/>
  <text class="lbl" x="64" y="271">Create your first practice plan</text>
  <text class="sm" x="322" y="271" text-anchor="end">›</text>

  <circle cx="400" cy="60" r="11" fill="var(--bg-accent-translucent)"/>
  <text x="400" y="65" text-anchor="middle" style="font-size:12px; fill: var(--fg-accent)">1</text>
  <text class="sm" x="420" y="65">Pops up as a bottom sheet the first time</text>
  <text class="sm" x="420" y="82">a coach reaches the roster after signup.</text>

  <circle cx="400" cy="140" r="11" fill="none" stroke="var(--fg-secondary)"/>
  <text x="400" y="145" text-anchor="middle" style="font-size:12px; fill: var(--fg-secondary)">2</text>
  <text class="sm" x="420" y="145">After that it stays as a compact card at</text>
  <text class="sm" x="420" y="162">the top of the roster until all 3 are done.</text>

  <circle cx="400" cy="220" r="11" fill="none" stroke="var(--fg-secondary)"/>
  <text x="400" y="225" text-anchor="middle" style="font-size:12px; fill: var(--fg-secondary)">3</text>
  <text class="sm" x="420" y="225">Dismissing hides it; it never returns</text>
  <text class="sm" x="420" y="242">once every step is complete.</text>
</svg>
