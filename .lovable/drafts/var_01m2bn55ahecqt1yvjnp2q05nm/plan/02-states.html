<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-secondary); font-size: 12px; }
    .lab { fill: var(--fg-primary); font-size: 14px; font-weight: 480; }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .bar { fill: var(--border-translucent); }
  </style>

  <!-- open bubble -->
  <text class="lab" x="24" y="28">Open</text>
  <rect class="box" x="24" y="40" width="250" height="150" rx="8"
        fill="var(--bg-accent-translucent)"/>
  <path d="M44 190 L44 212 L70 190 Z" fill="var(--bg-accent-translucent)"
        stroke="var(--fg-secondary)" stroke-width="1"/>
  <rect x="40" y="56" width="10" height="14" rx="5" fill="var(--fg-accent)"/>
  <rect x="54" y="50" width="10" height="20" rx="5" fill="var(--fg-accent)"/>
  <rect x="68" y="60" width="10" height="10" rx="5" fill="var(--fg-accent)"/>
  <text x="86" y="66">Get set up · 0 / 3</text>
  <text x="246" y="66" text-anchor="end">×</text>
  <rect class="bar" x="40" y="86" width="190" height="8" rx="4"/>
  <rect class="bar" x="40" y="104" width="150" height="8" rx="4"/>
  <rect x="40" y="124" width="86" height="24" rx="8" fill="var(--bg-accent)"/>
  <text x="83" y="140" text-anchor="middle" fill="var(--fg-emphasis)">Add schedule</text>
  <rect class="bar" x="40" y="162" width="120" height="8" rx="4"/>

  <!-- arrows -->
  <line x1="292" y1="115" x2="356" y2="115" stroke="var(--fg-secondary)"
        stroke-width="1" marker-end="url(#c)"/>
  <text x="324" y="106" text-anchor="middle">close</text>
  <line x1="356" y1="145" x2="292" y2="145" stroke="var(--fg-secondary)"
        stroke-width="1" stroke-dasharray="4 3" marker-end="url(#c)"/>
  <text x="324" y="164" text-anchor="middle">tap</text>
  <defs>
    <marker id="c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 1 L7 4 L0 7" fill="none" stroke="var(--fg-secondary)" stroke-width="1"/>
    </marker>
  </defs>

  <!-- minimized -->
  <text class="lab" x="376" y="28">Minimized</text>
  <rect class="box" x="376" y="40" width="240" height="150" rx="8"
        stroke="var(--border-translucent)" stroke-dasharray="4 3"/>
  <text x="396" y="66">roster page continues</text>
  <rect class="bar" x="396" y="82" width="180" height="8" rx="4"/>
  <rect class="bar" x="396" y="100" width="140" height="8" rx="4"/>
  <circle cx="580" cy="158" r="22" fill="var(--bg-accent)"/>
  <rect x="571" y="152" width="5" height="11" rx="2.5" fill="var(--fg-emphasis)"/>
  <rect x="578" y="148" width="5" height="15" rx="2.5" fill="var(--fg-emphasis)"/>
  <rect x="585" y="155" width="5" height="8" rx="2.5" fill="var(--fg-emphasis)"/>
  <path d="M566 174 L566 184 L576 176 Z" fill="var(--bg-accent)"/>
  <text x="556" y="196" text-anchor="end">3 left</text>
</svg>
