<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .tab { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .quiet { fill: hsl(var(--muted)); stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
  </style>

  <!-- active tab -->
  <path class="tab" d="M20 40 h150 a8 8 0 0 1 8 8 v40 h-166 v-40 a8 8 0 0 1 8 -8 z" />
  <circle cx="44" cy="68" r="14" fill="hsl(var(--accent))" opacity="0.18" />
  <circle cx="44" cy="68" r="9" fill="hsl(var(--accent))" opacity="0.32" />
  <circle cx="44" cy="68" r="5" fill="hsl(var(--accent))" />
  <text class="lbl" x="66" y="73">A RINK · live</text>

  <!-- idle tab -->
  <path class="quiet" d="M210 46 h150 a8 8 0 0 1 8 8 v34 h-166 v-34 a8 8 0 0 1 8 -8 z" />
  <circle cx="234" cy="71" r="5" fill="hsl(var(--muted-foreground))" />
  <text class="lbl" x="256" y="76">B RINK · idle</text>

  <!-- idle tab 2 -->
  <path class="quiet" d="M400 46 h150 a8 8 0 0 1 8 8 v34 h-166 v-34 a8 8 0 0 1 8 -8 z" />
  <circle cx="424" cy="71" r="5" fill="hsl(var(--muted-foreground))" />
  <text class="lbl" x="446" y="76">C RINK · idle</text>

  <!-- panel edge -->
  <line x1="20" y1="88" x2="620" y2="88" stroke="hsl(var(--border))" stroke-width="1" />

  <circle cx="30" cy="130" r="9" fill="hsl(var(--accent))" />
  <text x="30" y="134" text-anchor="middle" style="font-size:11px; fill: hsl(var(--accent-foreground))">1</text>
  <text class="note" x="48" y="134">Accent dot + expanding halo = this rink has skaters on the ice right now</text>

  <circle cx="30" cy="160" r="9" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1" />
  <text x="30" y="164" text-anchor="middle" style="font-size:11px; fill: hsl(var(--muted-foreground))">2</text>
  <text class="note" x="48" y="164">Grey static dot = rink is idle. Same slot, so nothing looks missing.</text>
</svg>
