<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 13px; font-weight: 480; fill: hsl(var(--foreground)); }
    .lbl-back { font-size: 13px; font-weight: 480; fill: hsl(var(--muted-foreground)); }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
  </style>

  <!-- back tab B -->
  <path d="M188 48 h130 a8 8 0 0 1 8 8 v36 h-146 v-36 a8 8 0 0 1 8 -8 z"
        fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))" stroke-width="1" />
  <circle cx="208" cy="72" r="4.5" fill="hsl(var(--muted-foreground))" />
  <text class="lbl-back" x="222" y="77">B RINK</text>

  <!-- back tab C -->
  <path d="M348 48 h130 a8 8 0 0 1 8 8 v36 h-146 v-36 a8 8 0 0 1 8 -8 z"
        fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))" stroke-width="1" />
  <circle cx="368" cy="72" r="4.5" fill="hsl(var(--muted-foreground))" />
  <text class="lbl-back" x="382" y="77">C RINK</text>

  <!-- front tab A (drawn last = on top) -->
  <path d="M28 40 h130 a8 8 0 0 1 8 8 v46 h-146 v-46 a8 8 0 0 1 8 -8 z"
        fill="hsl(var(--card))" stroke="hsl(var(--muted-foreground))" stroke-width="1" />
  <circle cx="48" cy="68" r="12" fill="hsl(var(--accent))" opacity="0.2" />
  <circle cx="48" cy="68" r="4.5" fill="hsl(var(--accent))" />
  <text class="lbl" x="62" y="73">A RINK</text>

  <!-- card body -->
  <path d="M28 92 h584 a8 8 0 0 1 8 8 v40 h-600 v-40 a8 8 0 0 1 8 -8 z"
        fill="hsl(var(--card))" stroke="hsl(var(--muted-foreground))" stroke-width="1" />
  <rect x="48" y="108" width="120" height="8" rx="4" fill="hsl(var(--border))" />
  <rect x="48" y="124" width="220" height="8" rx="4" fill="hsl(var(--border))" />

  <circle cx="38" cy="168" r="9" fill="hsl(var(--accent))" />
  <text x="38" y="172" text-anchor="middle" style="font-size:11px; fill: hsl(var(--accent-foreground))">1</text>
  <text class="note" x="56" y="172">Front tab: card tone, primary ink, taller, bottom edge merges into the card</text>

  <circle cx="38" cy="196" r="9" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1" />
  <text x="38" y="200" text-anchor="middle" style="font-size:11px; fill: hsl(var(--muted-foreground))">2</text>
  <text class="note" x="56" y="200">Back tabs: darker paper tone, secondary ink, grey static dot, shorter</text>
</svg>
