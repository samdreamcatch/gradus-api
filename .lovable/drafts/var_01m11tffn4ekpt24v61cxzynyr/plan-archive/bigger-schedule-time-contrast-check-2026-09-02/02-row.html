<svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--muted-foreground)); font-size: 12px; }

  </style>

  <text x="0" y="14">before — 9px time</text>
  <rect class="box" x="0" y="24" width="300" height="52" rx="8"/>
  <text class="mono" x="12" y="46" style="font-size:9px">10:00 PM</text>
  <text class="lbl" x="70" y="46">Juvenile Girls · Free Skate</text>
  <text class="mono" x="70" y="64" style="font-size:9px">B RINK</text>

  <text x="340" y="14">after — 11px time</text>
  <rect class="box" x="340" y="24" width="300" height="52" rx="8"/>
  <line x1="340" y1="24" x2="340" y2="76" stroke="hsl(var(--accent))" stroke-width="3"/>

  <text x="24" y="116" style="fill:hsl(var(--foreground))">1</text>
  <text x="40" y="116">Time steps 9px to 11px and the column widens, so long times never wrap.</text>
  <text x="40" y="140">Titles keep the remaining width and wrap to a second line when needed.</text>
  <text x="40" y="164">Rink line, live dot and tags are unchanged.</text>
</svg>
