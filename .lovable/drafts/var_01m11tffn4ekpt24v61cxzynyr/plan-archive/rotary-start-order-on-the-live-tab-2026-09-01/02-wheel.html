<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); width: 100%; height: auto;">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .sm  { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono{ font-size: 12px; font-family: var(--font-mono); fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .rail{ stroke: hsl(var(--border)); stroke-width: 1; }
    .greek { fill: hsl(var(--border)); }
  </style>

  <!-- viewport frame -->
  <rect x="24" y="24" width="300" height="352" rx="8" class="rail" fill="none" stroke-dasharray="4 3"/>
  <text x="34" y="44" class="mono">live card viewport</text>

  <!-- card 6, far above: tilted, small, faded -->
  <g transform="translate(174 92) rotate(-4)" opacity="0.35">
    <rect x="-120" y="-20" width="240" height="40" rx="8" class="box"/>
    <text x="-104" y="5" class="sm">6 · scored 58.90</text>
  </g>

  <!-- card 7, above -->
  <g transform="translate(174 142) rotate(-2)" opacity="0.6">
    <rect x="-126" y="-23" width="252" height="46" rx="8" class="box"/>
    <text x="-110" y="3" class="lbl">7 Josephine Marr</text>
    <text x="-110" y="17" class="sm">62.41</text>
  </g>

  <!-- centered card: now -->
  <g transform="translate(174 210)">
    <rect x="-134" y="-32" width="268" height="64" rx="8" class="box" stroke="hsl(var(--accent))" stroke-width="1.5"/>
    <text x="-118" y="-10" class="mono" style="fill: hsl(var(--accent-foreground)); font-size:10px; letter-spacing:0.08em;">ON THE ICE</text>
    <text x="-118" y="10" class="lbl">8 Nora Donaldson</text>
    <text x="-118" y="24" class="sm">Onyx-Suburban SA · awaiting score</text>
  </g>

  <!-- card 9, below -->
  <g transform="translate(174 278) rotate(2)" opacity="0.6">
    <rect x="-126" y="-23" width="252" height="46" rx="8" class="box"/>
    <text x="-110" y="3" class="lbl">9 Addie DiMuro</text>
    <text x="-110" y="17" class="sm">Ann Arbor FSC</text>
  </g>

  <!-- card 10, far below -->
  <g transform="translate(174 328) rotate(4)" opacity="0.35">
    <rect x="-120" y="-20" width="240" height="40" rx="8" class="box"/>
    <text x="-104" y="5" class="sm">10 · not yet skated</text>
  </g>

  <!-- hidden pivot arc -->
  <path d="M 360 92 Q 300 210 360 328" class="rail" fill="none" stroke-dasharray="4 3"/>
  <circle cx="372" cy="210" r="3" fill="hsl(var(--accent))"/>
  <text x="384" y="214" class="mono">hidden pivot</text>

  <!-- ledger -->
  <g>
    <circle cx="372" cy="92" r="10" fill="hsl(var(--accent))"/>
    <text x="372" y="96" text-anchor="middle" style="font-size:11px; font-weight:600; fill: hsl(var(--accent-foreground));">1</text>
    <text x="392" y="90" class="lbl">Spin back</text>
    <text x="392" y="106" class="sm">earlier skaters, with their posted scores</text>

    <circle cx="372" cy="150" r="10" fill="hsl(var(--accent))"/>
    <text x="372" y="154" text-anchor="middle" style="font-size:11px; font-weight:600; fill: hsl(var(--accent-foreground));">2</text>
    <text x="392" y="148" class="lbl">Center is now</text>
    <text x="392" y="164" class="sm">full weight, role label, tap for protocol</text>

    <circle cx="372" cy="268" r="10" fill="hsl(var(--accent))"/>
    <text x="372" y="272" text-anchor="middle" style="font-size:11px; font-weight:600; fill: hsl(var(--accent-foreground));">3</text>
    <text x="392" y="266" class="lbl">Spin forward</text>
    <text x="392" y="282" class="sm">who is still to come, no scores yet</text>

    <circle cx="372" cy="326" r="10" fill="hsl(var(--accent))"/>
    <text x="372" y="330" text-anchor="middle" style="font-size:11px; font-weight:600; fill: hsl(var(--accent-foreground));">4</text>
    <text x="392" y="324" class="lbl">Release</text>
    <text x="392" y="340" class="sm">springs back to the live skater</text>
  </g>
</svg>
