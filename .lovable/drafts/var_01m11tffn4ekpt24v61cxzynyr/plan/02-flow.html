<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .tag { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="ch" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="zone" x="8" y="16" width="300" height="112" rx="8"/>
  <text class="tag" x="20" y="34">during the competition</text>

  <rect class="box" x="28" y="48" width="120" height="52" rx="8"/>
  <text class="lbl" x="88" y="70" text-anchor="middle">Follow skater</text>
  <text class="note" x="88" y="88" text-anchor="middle">on live board</text>

  <line class="wire" x1="152" y1="74" x2="184" y2="74" marker-end="url(#ch)"/>

  <rect class="box" x="188" y="48" width="108" height="52" rx="8"/>
  <text class="lbl" x="242" y="70" text-anchor="middle">Attendance</text>
  <text class="note" x="242" y="88" text-anchor="middle">saved to account</text>

  <line class="wire" x1="300" y1="74" x2="344" y2="74" marker-end="url(#ch)"/>
  <text class="note" x="322" y="64" text-anchor="middle" style="paint-order: stroke; stroke: hsl(var(--background)); stroke-width: 4px;">final</text>

  <rect class="zone" x="332" y="16" width="300" height="112" rx="8"/>
  <text class="tag" x="344" y="34">after it ends</text>

  <rect x="352" y="48" width="120" height="52" rx="8" fill="hsl(var(--accent))" stroke="none"/>
  <text class="lbl" x="412" y="70" text-anchor="middle" fill="hsl(var(--accent-foreground))">Recap card</text>
  <text x="412" y="88" text-anchor="middle" font-size="12" fill="hsl(var(--accent-foreground))">home screen</text>

  <line class="wire" x1="476" y1="74" x2="508" y2="74" marker-end="url(#ch)"/>

  <rect class="box" x="512" y="48" width="104" height="52" rx="8"/>
  <text class="lbl" x="564" y="70" text-anchor="middle">Recap sheet</text>
  <text class="note" x="564" y="88" text-anchor="middle">4 prompts</text>

  <line class="wire" x1="564" y1="104" x2="564" y2="150" marker-end="url(#ch)"/>

  <rect class="box" x="424" y="154" width="192" height="52" rx="8"/>
  <text class="lbl" x="520" y="176" text-anchor="middle">Athlete record</text>
  <text class="note" x="520" y="194" text-anchor="middle">private to the athlete's circle</text>

  <line class="wire" x1="424" y1="180" x2="360" y2="180" marker-end="url(#ch)"/>

  <rect class="box" x="228" y="154" width="128" height="52" rx="8"/>
  <text class="lbl" x="292" y="176" text-anchor="middle">Coach reads it</text>
  <text class="note" x="292" y="194" text-anchor="middle">athlete detail sheet</text>

  <circle cx="36" cy="180" r="10" fill="hsl(var(--accent))"/>
  <text x="36" y="184" text-anchor="middle" font-size="12" fill="hsl(var(--accent-foreground))">1</text>
  <text class="note" x="54" y="178">Parent and athlete are prompted</text>
  <text class="note" x="54" y="194">separately; no message is sent.</text>

  <circle cx="36" cy="240" r="10" fill="hsl(var(--accent))"/>
  <text x="36" y="244" text-anchor="middle" font-size="12" fill="hsl(var(--accent-foreground))">2</text>
  <text class="note" x="54" y="238">Card asks for up to 7 days, then</text>
  <text class="note" x="54" y="254">stops. Nothing shows on the board.</text>
</svg>
