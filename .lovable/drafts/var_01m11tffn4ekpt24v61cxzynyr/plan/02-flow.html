<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Board request routing with a demo slug short-circuit">

<defs>

<text class="s" x="396" y="152" text-anchor="middle" style="paint-order:stroke;stroke:hsl(var(--background));stroke-width:4px">no</text>

<rect class="b" x="360" y="192" width="266" height="48" rx="8"/>
