<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where a vertical drag can go: page scroll versus the wheel">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .lbl { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { stroke: hsl(var(--accent)); stroke-width: 1.5; fill: none; }
    .quiet { fill: hsl(var(--muted)); stroke: none; }
    .mono { font-family: var(--font-mono); font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="hsl(var(--muted-foreground))"/>
    </marker>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="hsl(var(--accent))"/>
    </marker>
  </defs>

  <text class="lbl" x="16" y="20">a finger moving down</text>

  <rect class="zone" x="16" y="34" width="240" height="240" rx="8"/>
  <text class="mono" x="28" y="52">today</text>
  <rect class="quiet" x="36" y="64" width="200" height="60" rx="8"/>
  <rect class="box" x="36" y="64" width="200" height="60" rx="8"/>
  <text class="lbl" x="52" y="100">page scroll</text>
  <rect class="box" x="36" y="180" width="200" height="60" rx="8"/>
  <text x="52" y="216">wheel — never gets it</text>
  <path class="wire" d="M136 128 L136 174" marker-end="url(#a)"/>

  <path class="wire" d="M276 154 L336 154" marker-end="url(#a)"/>

  <rect class="zone" x="356" y="34" width="268" height="240" rx="8"/>
  <text class="mono" x="368" y="52">after</text>
  <rect class="box" x="376" y="64" width="228" height="60" rx="8"/>
  <text x="392" y="100">page scroll — outside the card</text>
  <rect class="quiet" x="376" y="180" width="228" height="60" rx="8"/>
  <rect class="acc" x="376" y="180" width="228" height="60" rx="8"/>
  <text class="lbl" x="392" y="209">wheel claims the drag</text>
  <text x="392" y="228">anywhere on the card</text>
  <path class="acc" d="M490 128 L490 174" marker-end="url(#b)"/>
</svg>
