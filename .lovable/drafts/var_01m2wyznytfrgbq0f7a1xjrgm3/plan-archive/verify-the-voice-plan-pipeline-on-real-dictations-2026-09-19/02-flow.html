<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verification flow from corpus to report">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); font-size: 12px; }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { fill: var(--fg-secondary); }
    .mono { font-family: var(--font-mono); fill: var(--fg-secondary); }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; rx: 8; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .wire { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--fg-secondary)"/>
    </marker>
  </defs>

  <rect class="zone" x="8" y="20" width="180" height="180"/>
  <text class="mono" x="18" y="38">corpus</text>
  <rect class="box" x="24" y="48" width="148" height="30"/><text class="lbl" x="36" y="68">clean multi-move</text>
  <rect class="box" x="24" y="84" width="148" height="30"/><text class="lbl" x="36" y="104">rambling / partial</text>
  <rect class="box" x="24" y="120" width="148" height="30"/><text class="lbl" x="36" y="140">no targets, odd names</text>
  <rect class="box" x="24" y="156" width="148" height="30"/><text class="lbl" x="36" y="176">very long dictation</text>

  <line class="wire" x1="188" y1="110" x2="236" y2="110" marker-end="url(#a)"/>

  <rect class="box" x="240" y="70" width="150" height="80"/>
  <text class="lbl" x="262" y="104">structuring step</text>
  <text class="note" x="262" y="124">strict shape, then retry</text>

  <line class="wire" x1="390" y1="110" x2="438" y2="110" marker-end="url(#a)"/>

  <rect x="442" y="60" width="182" height="100" rx="8" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)" stroke-width="1"/>
  <text class="lbl" x="462" y="92" fill="var(--fg-accent)">per-case report</text>
  <text class="note" x="462" y="114">moves kept / dropped</text>
  <text class="note" x="462" y="132">title, athlete, retry used</text>

  <circle cx="30" cy="238" r="9" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)"/>
  <text x="26" y="242" font-size="11" fill="var(--fg-accent)">1</text>
  <text class="note" x="48" y="242">No plans are created and nothing is saved — the run only reports.</text>
</svg>
