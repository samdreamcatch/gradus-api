name: Bun CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter
        run: bun run lint
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build project
        run: bun run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
