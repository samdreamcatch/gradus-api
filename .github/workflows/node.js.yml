# This workflow will do a clean installation of bun dependencies, cache/restore them, build the source code and run tests across different versions of bun
name: Bun CI
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Linter
        run: bun run lint
      - name: Build project
        run: bun run build --if-present
