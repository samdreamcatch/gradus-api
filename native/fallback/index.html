<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gradus</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f5f6fa;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161b25;
          color: #f0f2f5;
        }
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        opacity: 0.7;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gradus</h1>
      <p>You're offline. Reconnect and reopen the app to pick up where you left off.</p>
    </main>
  </body>
</html>
